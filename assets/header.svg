<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Ali Khan — stay determined, keep building</title><desc id="desc">A pixel adventurer explores a starry room while a red soul dodges white bones and stays still for blue attacks and a golden SAVE point spins. Animation can be disabled with reduced motion.</desc>
<style>
text{font-family:Courier New,monospace}.walk{animation:walk 12s linear infinite}.feet{animation:feet .32s steps(2,end) infinite}.soul{animation:dodge 10s linear infinite}.white-bones{animation:whitewave 10s linear infinite}.blue-bone{animation:bluewave 10s linear infinite}.dodge-label{animation:dodgelabel 10s steps(1,end) infinite}.hold-label{animation:holdlabel 10s steps(1,end) infinite;opacity:0}.save{transform-box:fill-box;transform-origin:center;animation:save 3s steps(8,end) infinite}.spark{animation:spark 3s ease-out infinite}.cursor{animation:blink 1s steps(2,end) infinite}.star{animation:twinkle 4s steps(3,end) infinite}.trail{animation:trail 8s linear infinite}
@keyframes walk{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(135px)}95%,100%{transform:translateX(0)}}
@keyframes feet{50%{transform:translateY(-3px)}}
@keyframes dodge{0%,14%{transform:translate(0,-10px)}18%,24%{transform:translate(0,24px)}28%,46%{transform:translate(0,-10px)}50%,76%{transform:translate(0,0)}84%,92%{transform:translate(35px,0)}100%{transform:translate(0,-10px)}}
@keyframes trail{0%,100%{transform:translate(0,0);opacity:0}15%{transform:translate(45px,-30px);opacity:.3}30%{transform:translate(90px,0);opacity:.15}45%{transform:translate(65px,40px);opacity:.3}60%{transform:translate(-25px,30px);opacity:.15}75%{transform:translate(-65px,-20px);opacity:.3}90%{transform:translate(-35px,-45px);opacity:.15}}
@keyframes whitewave{0%{transform:translateX(0);opacity:1}46%{transform:translateX(-680px);opacity:1}47%,100%{transform:translateX(-680px);opacity:0}}
@keyframes bluewave{0%,50%{transform:translateX(0);opacity:0}51%{transform:translateX(0);opacity:1}76%{transform:translateX(-285px);opacity:1}77%,100%{transform:translateX(-285px);opacity:0}}
@keyframes dodgelabel{0%,50%{opacity:1}51%,76%{opacity:0}77%,100%{opacity:1}}
@keyframes holdlabel{0%,50%{opacity:0}51%,76%{opacity:1}77%,100%{opacity:0}}
@keyframes save{50%{transform:rotate(180deg) scale(.65)}100%{transform:rotate(360deg)}}
@keyframes spark{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
@keyframes blink{50%{opacity:0}}@keyframes twinkle{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.walk,.feet,.soul,.white-bones,.blue-bone,.dodge-label,.hold-label,.save,.spark,.cursor,.star,.trail{animation:none}.white-bones,.blue-bone,.hold-label,.trail{opacity:0}}
</style><defs><clipPath id="arena"><rect x="705" y="95" width="247" height="160"/></clipPath><path id="heart" d="M-8 -10h6v2h4v-2h6v2h2v2h2v8h-2v2H8v2H6v2H4v2H2v2h-4v-2h-2V8h-2V6h-2V4h-2V2h-2v-8h2v-2h2z"/></defs>
<rect width="1000" height="400" fill="#08080d"/><rect x="12" y="12" width="976" height="376" fill="none" stroke="#fff" stroke-width="3"/>
<text x="42" y="55" fill="#b9a8e0" font-size="15">STING-RAIDER // AI · REINFORCEMENT LEARNING · SYSTEMS</text>
<text x="42" y="125" fill="#fff" font-size="59" font-weight="bold">ALI KHAN</text>
<text x="42" y="169" fill="#ffda6a" font-size="21">* Stay determined. Keep building.</text>
<text x="42" y="211" fill="#ccc6d9" font-size="17">Teaching machines to drive, grasp, and think.</text>
<text x="42" y="241" fill="#ccc6d9" font-size="17">Making the results public, failures included.</text>
<rect x="705" y="95" width="247" height="160" fill="#0d0c16" stroke="#fff" stroke-width="3"/>
<text x="709" y="80" fill="#b9a8e0" font-size="13">SOUL / BONE ENCOUNTER</text>
<g clip-path="url(#arena)" shape-rendering="crispEdges"><g class="white-bones" fill="#fff"><g transform="translate(966 98)"><path d="M-4 0h6v2h4V0h6v6h-4v31h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g><g transform="translate(966 181)"><path d="M-4 0h6v2h4V0h6v6h-4v59h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g><g transform="translate(1116 98)"><path d="M-4 0h6v2h4V0h6v6h-4v66h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g><g transform="translate(1116 216)"><path d="M-4 0h6v2h4V0h6v6h-4v24h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g><g transform="translate(1266 98)"><path d="M-4 0h6v2h4V0h6v6h-4v31h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g><g transform="translate(1266 181)"><path d="M-4 0h6v2h4V0h6v6h-4v59h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g></g><g transform="translate(967 99)"><g class="blue-bone" fill="#42c9ff"><path d="M-4 0h6v2h4V0h6v6h-4v142h4v6H6v-2H2v2h-6v-6H0V6h-4z"/></g></g><g transform="translate(818 171)"><use class="soul" href="#heart" fill="#ff0000"/></g></g><text class="dodge-label" x="746" y="277" fill="#fff" font-size="12">WHITE / DODGE</text><text class="hold-label" x="730" y="277" fill="#42c9ff" font-size="12">BLUE / HOLD STILL</text>
<path d="M32 335H968" stroke="#504360" stroke-width="2"/>
<text x="42" y="371" fill="#ffda6a" font-size="17">* You're filled with the urge to ship.</text><rect class="cursor" x="488" y="355" width="9" height="18" fill="#ffda6a"/>
<g transform="translate(638 272)"><g class="walk"><g shape-rendering="crispEdges"><path fill="#352b47" d="M0 0h32v8h8v28H0z"/><path fill="#e9c18e" d="M0 12h32v24H0z"/><path fill="#352b47" d="M0 12h8v8H0zm24 0h8v8h-8z"/><path fill="#08080d" d="M8 24h4v4H8zm12 0h4v4h-4z"/><path fill="#9970cd" d="M0 36h32v20H0z"/><path fill="#6499c9" d="M0 44h32v8H0z"/><path fill="#e9c18e" d="M-8 36h8v16h-8zm40 0h8v16h-8z"/><g class="feet" fill="#433854"><path d="M0 56h12v8H0zm20 0h12v8H20z"/></g></g></g></g>
<g transform="translate(930 301)"><path class="save" d="M0 -24h6v12h6v6h12v6H12v6H6v12H0V6h-6V0h-12v-6h12v-6H0z" fill="#ffda6a"/></g>
<g class="spark" fill="#ffda6a"><rect x="910" y="284" width="4" height="4"/><rect x="947" y="300" width="4" height="4"/><rect x="920" y="316" width="4" height="4"/></g>
<path class="star" style="animation-delay:2s" d="M630 88v8m-4 -4h8" stroke="#a383e6"/><path class="star" style="animation-delay:2s" d="M666 136v8m-4 -4h8" stroke="#a383e6"/><path class="star" style="animation-delay:2s" d="M594 278v8m-4 -4h8" stroke="#a383e6"/><path class="star" style="animation-delay:2s" d="M902 40v8m-4 -4h8" stroke="#a383e6"/><path class="star" style="animation-delay:0s" d="M960 282v8m-4 -4h8" stroke="#a383e6"/><path class="star" style="animation-delay:0s" d="M564 59v8m-4 -4h8" stroke="#a383e6"/></svg>