name: Refresh contribution SAVE file
on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/render_activity.py, .github/workflows/activity.yml]
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate activity graphic
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/render_activity.py
      - name: Commit refreshed graphic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution activity'
          git pull --rebase origin main
          git push origin HEAD:main
